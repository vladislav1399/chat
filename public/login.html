<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Регистрация</title>
    <link rel="stylesheet" href="./сss/register.css">
</head>

<body>

<div class="form-container">
    <h2>Войти</h2>

    <form id="loginForm">
        <div class="input-group">
            <label for="username">Ник</label>
            <input type="text" id="username" placeholder="Введите ник" required>
        </div>

        <div class="input-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль" required>
        </div>

        <button type="submit">Войти</button>
    </form>

    <div class="footer-text">
        <a href="/register">Нет аккаунта? Создать аккаунт</a>
    </div>
</div>


<script src="./js/login.js"></script>
<script src="./js/check-token.js"></script>
</body>
</html>
