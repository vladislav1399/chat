<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>

    <style>
        body{
            margin:0;
            background:#111827;
            color:white;
            font-family:Inter,sans-serif;
        }

        .chat{
            width:500px;
            height:700px;
            margin:20px auto;
            background:#1f2937;
            border-radius:20px;
            display:flex;
            flex-direction:column;
        }

        .messages{
            flex:1;
            overflow-y:auto;
            padding:20px;
        }

        .message{
            padding:10px 15px;
            background:#374151;
            margin-bottom:10px;
            border-radius:12px;
        }

        .bottom{
            display:flex;
            padding:15px;
            gap:10px;
        }

        input{
            flex:1;
            padding:12px;
            border-radius:10px;
            border:none;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<div class="chat">
    <div class="messages" id="messages"></div>

    <div class="bottom">
        <input id="input">
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
    const ws = new WebSocket(`ws://localhost:8880`);

    ws.onopen = () => {
        console.log("✅ WS connected");
    };

    const messages = document.getElementById("messages");
    const input = document.getElementById("input");

    ws.onmessage = ({ data }) => {
        console.log(data)
        const div = document.createElement("div");
        div.className = "message";
        div.textContent = data;

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    };

    function send() {
        const text = input.value.trim();

        if (!text) return;

        ws.send(text);
        input.value = "";
    }

    input.addEventListener("keydown", e => {
        if (e.key === "Enter") send();
    });
</script>

</body>
</html>
